name: "Alpine Appliance Builder"
description: "Build immutable live/diskless Alpine Linux SD images (.img.gz and .tar.gz) for Raspberry Pi from APKs or declarative recipes."
author: "Jose Juan Montiel"

branding:
  icon: "hard-drive"
  color: "blue"

inputs:
  recipe:
    description: "Path to declarative appliance recipe file (e.g. appliance.yaml)"
    required: false
    default: ""
  apk:
    description: "Path or URL to a custom .apk package to inject"
    required: false
    default: ""
  name:
    description: "Appliance name prefix for generated image"
    required: false
    default: ""
  board:
    description: "Target board (rpi-zero | rpi-3 | rpi-4 | generic-x86_64)"
    required: false
    default: "rpi-zero"
  wifi-ssid:
    description: "Default WiFi SSID (can also be configured via drop-in on SD)"
    required: false
    default: ""
  wifi-pass:
    description: "Default WiFi password"
    required: false
    default: ""
  ip:
    description: "Static IP address for wlan0"
    required: false
    default: ""

outputs:
  image-path:
    description: "Path to the generated .img.gz disk image"
    value: ${{ steps.build.outputs.image_path }}
  tarball-path:
    description: "Path to the generated .tar.gz SD tarball"
    value: ${{ steps.build.outputs.tarball_path }}
  image_path:
    description: "Path to the generated .img.gz disk image"
    value: ${{ steps.build.outputs.image_path }}
  tarball_path:
    description: "Path to the generated .tar.gz SD tarball"
    value: ${{ steps.build.outputs.tarball_path }}

runs:
  using: "composite"
  steps:
    - name: Set up QEMU (ARM emulation)
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm,arm64

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Appliance Image
      id: build
      shell: bash
      run: |
        set -e
        WORKSPACE_DIR="${GITHUB_WORKSPACE:-$(pwd)}"
        CMD_ARGS=()
        
        # Convertir recipe a ruta absoluta si es relativa
        RECIPE_INPUT="${{ inputs.recipe }}"
        if [ -n "$RECIPE_INPUT" ]; then
          if [[ "$RECIPE_INPUT" != /* && ! "$RECIPE_INPUT" =~ ^https?:// ]]; then
            RECIPE_INPUT="$WORKSPACE_DIR/$RECIPE_INPUT"
          fi
          CMD_ARGS+=(--recipe "$RECIPE_INPUT")
        fi
        
        # Convertir apk a ruta absoluta si es relativa y no es URL
        APK_INPUT="${{ inputs.apk }}"
        if [ -n "$APK_INPUT" ]; then
          if [[ "$APK_INPUT" != /* && ! "$APK_INPUT" =~ ^https?:// ]]; then
            APK_INPUT="$WORKSPACE_DIR/$APK_INPUT"
          fi
          CMD_ARGS+=(--apk "$APK_INPUT")
        fi
        
        if [ -n "${{ inputs.name }}" ]; then
          CMD_ARGS+=(--name "${{ inputs.name }}")
        fi
        
        if [ -n "${{ inputs.board }}" ]; then
          CMD_ARGS+=(--board "${{ inputs.board }}")
        fi

        if [ -n "${{ inputs.wifi-ssid }}" ]; then
          CMD_ARGS+=(--wifi-ssid "${{ inputs.wifi-ssid }}")
        fi
        
        if [ -n "${{ inputs.wifi-pass }}" ]; then
          CMD_ARGS+=(--wifi-pass "${{ inputs.wifi-pass }}")
        fi
        
        if [ -n "${{ inputs.ip }}" ]; then
          CMD_ARGS+=(--ip "${{ inputs.ip }}")
        fi

        # Ejecutar script de construcción
        "${{ github.action_path }}/build.sh" "${CMD_ARGS[@]}"

        # Crear y copiar artefactos generados en la acción hacia el workspace del llamador
        mkdir -p "$WORKSPACE_DIR/output"
        if compgen -G "${{ github.action_path }}/output/*" > /dev/null; then
          echo ">> Copiando artefactos generados a $WORKSPACE_DIR/output/ ..."
          cp -v ${{ github.action_path }}/output/* "$WORKSPACE_DIR/output/"
        fi

        # Obtener rutas de artefactos en el workspace
        IMG_PATH=$(ls "$WORKSPACE_DIR"/output/*.img.gz 2>/dev/null | head -n 1 || true)
        TAR_PATH=$(ls "$WORKSPACE_DIR"/output/*.tar.gz 2>/dev/null | head -n 1 || true)

        echo "image_path=${IMG_PATH}" >> $GITHUB_OUTPUT
        echo "tarball_path=${TAR_PATH}" >> $GITHUB_OUTPUT
        echo "image-path=${IMG_PATH}" >> $GITHUB_OUTPUT
        echo "tarball-path=${TAR_PATH}" >> $GITHUB_OUTPUT
